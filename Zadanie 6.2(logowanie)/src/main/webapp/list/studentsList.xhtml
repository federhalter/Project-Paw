<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <meta charset="utf-8" />
        <title>JSF 06 - EJB, bazy danych (mapowanie obiektowo-relacyjne)</title>
    </h:head>
    <h:body style="background-color: #eee; margin: 0.5em;">
            
        <p:panel header="Opcje wyszukiwania" toggleable="true" collapsed="true"
                 style="margin-bottom: 1em;">
            <h:form>
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel value="nazwisko:" />
                    <p:inputText value="#{studentsListBB.lastname}" />
                    <p:commandButton value="Szukaj" update="form-table" />
                </h:panelGrid>
            </h:form>
        </p:panel>

        <p:messages />

        <h:form id="form-table" style="margin-bottom:1em;">

            <p:commandButton value="Dodaj nową osobę" style="margin-bottom:1em;" 
                             action="#{studentsListBB.newStudent()}"/>

            <p:dataTable value="#{studentsListBB.list}" var="s">

                <p:column responsivePriority="5">
                    <f:facet name="header">
                        <h:outputText value="imię" />
                    </f:facet>
                    <h:outputText value="#{s.firstname}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="nazwisko" />
                    </f:facet>
                    <h:outputText value="#{s.lastname}" />
                </p:column>

                <p:column responsivePriority="4">
                    <f:facet name="header">
                        <h:outputText value="data ur." />
                    </f:facet>
                    <h:outputText value="#{s.birthdate}">
                        <f:convertDateTime pattern="dd-MM-yyyy" />
                    </h:outputText>
                </p:column>
                <p:column>
        <f:facet name="header">
            <h:outputText value="grupa" />
        </f:facet>
        <h:outputText value="#{s.groupname}" />
    </p:column>

    <!-- NOWY KOLUMN: averagegrade -->
    <p:column>
        <f:facet name="header">
            <h:outputText value="średnia" />
        </f:facet>
        <h:outputText value="#{s.averagegrade}" />
    </p:column>
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="opcje" />
                    </f:facet>

                    <p:commandButton value="Edytuj" style="margin-right: 0.5em"
                                     action="#{studentsListBB.editStudent(s)}"/>

                    <p:commandButton value="Usuń" style="margin-right: 0.5em"
                                     action="#{studentsListBB.deleteStudent(s)}"
                                     update="@form" />

                </p:column>

            </p:dataTable>
        </h:form>

    </h:body>
</html>
