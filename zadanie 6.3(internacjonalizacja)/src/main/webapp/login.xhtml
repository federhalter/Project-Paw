<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:p="http://primefaces.org/ui"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core">
<f:view locale="#{languageBB.locale}">
<h:head>
	
	<title>"#{msg['title.login']}"</title>
	
</h:head>

<h:body>
    <h:form id="menuForm">
            <p:menubar>

                <p:submenu label="#{msg['menu.language']}" icon="pi pi-globe">
                    <p:menuitem value="PL" 
                                action="#{languageBB.setPolish}" 
                                update="@all" 
                                icon="pi pi-flag"/>
                    <p:menuitem value="EN" 
                                action="#{languageBB.setEnglish}" 
                                update="@all" 
                                icon="pi pi-flag"/>
                </p:submenu>
            </p:menubar>
        </h:form>
	<div id="page_wrapper">
		<div id="content" class="box bottom-space">
			<h:form>
			<h:panelGrid columns="2" cellpadding="5" styleClass="bottom-space">
				<h:outputLabel for="login" value="#{msg['label.login']}:" />
				<h:inputText id="login" value="#{loginBB.login}"
					required="true"	requiredMessage="#{msg['label.setLogin']}"/>
				<h:outputLabel for="pass" value="#{msg['label.pass']}:" />
				<h:inputSecret id="pass" value="#{loginBB.pass}"
				required="true"	requiredMessage="#{msg['label.setPass']}"/>
			</h:panelGrid>
		
			<h:messages />
		
			<h:commandButton value="#{msg['button.login']}" action="#{loginBB.doLogin()}"/>

		</h:form>
		</div>
	</div>
</h:body>
</f:view>
</html>
